<!DOCTYPE html>
<html lang="en" prefix="og: https://ogp.me/ns#">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#121212" id="meta-theme-color">
    <meta name="color-scheme" content="dark">
    <title>{% block title %}TushN101 — Tech Blog &amp; Notes{% endblock %}</title>

    <!-- SEO Meta Tags & Snippet Optimization -->
    <meta name="description" content="{% block meta_description %}{% if post and post|length > 2 %}{{ post[2] }}{% else %}Personal notes, technical deep dives &amp; engineering writeups on software engineering, API security, cryptography, and network protocols by TushN101.{% endif %}{% endblock %}">
    <meta name="author" content="TushN101">
    <meta name="robots" content="{% block meta_robots %}index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1{% endblock %}">
    <meta name="googlebot" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">
    <meta name="bingbot" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">
    <link rel="canonical" href="{% block canonical_url %}{{ canonical_url or request.url }}{% endblock %}">
    <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml">

    <!-- Open Graph / Facebook -->
    <meta property="og:site_name" content="TushN101">
    <meta property="og:type" content="{% block og_type %}{% if post %}article{% else %}website{% endif %}{% endblock %}">
    <meta property="og:url" content="{% block og_url %}{{ canonical_url or request.url }}{% endblock %}">
    <meta property="og:title" content="{% block og_title %}{% if post and post|length > 1 %}{{ post[1] }} — TushN101{% else %}TushN101 — Tech Blog &amp; Notes{% endif %}{% endblock %}">
    <meta property="og:description" content="{% block og_description %}{% if post and post|length > 2 %}{{ post[2] }}{% else %}Personal notes, technical deep dives &amp; engineering writeups on software engineering, API security, cryptography, and network protocols by TushN101.{% endif %}{% endblock %}">
    <meta property="og:image" content="{% block og_image %}{% if post and post|length > 6 and post[6] %}{{ base_url or '' }}{{ post[6] }}{% else %}{{ base_url or '' }}/static/post7/image_with_apikey.png{% endif %}{% endblock %}">

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="{% block twitter_url %}{{ canonical_url or request.url }}{% endblock %}">
    <meta name="twitter:title" content="{% block twitter_title %}{% if post and post|length > 1 %}{{ post[1] }} — TushN101{% else %}TushN101 — Tech Blog &amp; Notes{% endif %}{% endblock %}">
    <meta name="twitter:description" content="{% block twitter_description %}{% if post and post|length > 2 %}{{ post[2] }}{% else %}Personal notes, technical deep dives &amp; engineering writeups on software engineering, API security, cryptography, and network protocols by TushN101.{% endif %}{% endblock %}">
    <meta name="twitter:image" content="{% block twitter_image %}{% if post and post|length > 6 and post[6] %}{{ base_url or '' }}{{ post[6] }}{% else %}{{ base_url or '' }}/static/post7/image_with_apikey.png{% endif %}{% endblock %}">

    <!-- JSON-LD Structured Data for Search Engines -->
    {% block structured_data %}
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "TushN101",
      "url": "{{ base_url or request.base_url }}",
      "description": "Personal notes, technical deep dives & engineering writeups by TushN101.",
      "author": {
        "@type": "Person",
        "name": "TushN101"
      }
    }
    </script>
    {% endblock %}

    <!-- Ultra-fast font preloading: 0ms external latency -->
    <link rel="preload" href="{{ url_for('static', filename='fonts/inter-latin.woff2') }}" as="font" type="font/woff2" crossorigin>

    <link rel="stylesheet" href="{{ url_for('static', filename='styles/style.css') }}">
    {% block head_extra %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">

    <a class="skip-link" href="#main-content">Skip to content</a>

    <!-- Top Reading Progress Meter -->
    <div class="readmeter" id="readmeter" aria-hidden="true">
        <div class="readmeter__fill" id="readmeter-fill" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
    </div>

    <!-- Top Navigation Bar -->
    <header class="topbar" id="site-header">
        <div class="topbar-left">
            <button class="icon-btn" id="menuToggle" aria-label="Toggle navigation sidebar" title="Toggle sidebar">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </button>
            <a href="/" class="brand">TushN101</a>
        </div>
        <div class="topbar-right">
            <a href="/about" class="topbar-nav-link">About</a>
            <a href="/contact" class="pill-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="m3 7 9 6 9-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                <span>Contact</span>
            </a>
            <button type="button" class="icon-btn" id="topbarShareBtn" aria-label="Share this site" title="Share link">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
            </button>
        </div>
    </header>

    <!-- Left Sidebar -->
    <aside class="sidebar" id="sidebar">
        <nav class="side-nav" aria-label="Primary Navigation">
            <a href="/" class="side-link{% block nav_home %}{% endblock %}" data-nav="home">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4.5 10.2 12 3.5l7.5 6.7V20a.5.5 0 0 1-.5.5h-4.5v-6h-5v6H5a.5.5 0 0 1-.5-.5z" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
                <span>Home</span>
            </a>
            <a href="/#feed" class="side-link{% block nav_articles %}{% endblock %}" data-nav="articles">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M6 3.5h12a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-15a1 1 0 0 1 1-1z" stroke="currentColor" stroke-width="1.4"/><path d="M8.5 8.5h7M8.5 12h7M8.5 15.5h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
                <span>All Posts</span>
            </a>
            <a href="/about" class="side-link{% block nav_about %}{% endblock %}" data-nav="about">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.6" stroke="currentColor" stroke-width="1.4"/><path d="M4.8 20c.6-3.6 3.6-5.6 7.2-5.6s6.6 2 7.2 5.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
                <span>About</span>
            </a>
            <a href="/contact" class="side-link{% block nav_contact %}{% endblock %}" data-nav="contact">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="m3 7 9 6 9-6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
                <span>Contact</span>
            </a>
        </nav>

        <hr class="side-divider" />

        <div class="side-topics">
            <span class="side-topics-title">Topics</span>
            <div class="side-topics-list">
                <button type="button" class="side-topic-btn" data-topic-filter="api">
                    <span class="topic-dot"></span>
                    <span>Web &amp; APIs</span>
                </button>
                <button type="button" class="side-topic-btn" data-topic-filter="crypto">
                    <span class="topic-dot"></span>
                    <span>Cryptography</span>
                </button>
                <button type="button" class="side-topic-btn" data-topic-filter="network">
                    <span class="topic-dot"></span>
                    <span>Networking</span>
                </button>
                <button type="button" class="side-topic-btn" data-topic-filter="disclosure">
                    <span class="topic-dot"></span>
                    <span>Bug Analysis</span>
                </button>
                <button type="button" class="side-topic-btn" data-topic-filter="mobile">
                    <span class="topic-dot"></span>
                    <span>Mobile Apps</span>
                </button>
            </div>
        </div>
    </aside>

    <div class="scrim" id="scrim"></div>

    <!-- Main Content Area -->
    <main class="main" id="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Floating Dock -->
    <div class="floating-dock" id="floating-dock" aria-label="Quick actions">
        <button type="button" class="floating-dock__btn floating-dock__btn--icon" id="btn-scroll-top" hidden aria-label="Back to top" title="Back to top">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M18 15l-6-6-6 6"/>
            </svg>
        </button>
        <button type="button" class="floating-dock__btn floating-dock__btn--share" id="btn-share-url" aria-label="Copy page link" title="Copy link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/>
                <path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/>
            </svg>
            <span class="floating-dock__label">Share</span>
        </button>
    </div>

    <!-- Toast Notification -->
    <div class="toast-region" aria-live="polite" aria-atomic="true">
        <div class="toast" id="site-toast" role="status"></div>
    </div>

    <script src="{{ url_for('static', filename='js/site.js') }}" defer></script>
    {% block scripts_extra %}{% endblock %}
</body>
</html>
