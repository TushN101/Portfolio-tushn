{% extends "base.html" %}
{% block title %}{{ post[1] }} — TushN101{% endblock %}
{% block content %}
<article class="article">
    <div class="article-header">
        <a href="/" class="back-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M19 12H5M12 19l-7-7 7-7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>All research writeups</span>
        </a>
        <div class="article-meta">
            <span class="chip static">Security Research</span>
            <span class="dim">·</span>
            <span>{{ post[3] }}</span>
        </div>
        <h1 class="article-title">{{ post[1] }}</h1>
        {% if post[2] %}
        <p class="article-sub">{{ post[2] }}</p>
        {% endif %}
    </div>

    <div class="article-body prose">
        {{ post[4] | safe if post|length > 4 else '' }}
    </div>

    <footer class="piece-foot">
        <a href="/" class="back-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M19 12H5M12 19l-7-7 7-7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Back to all posts</span>
        </a>
    </footer>
</article>
{% endblock %}
