{% extends "base.html" %}
{% block title %}{{ post[1] }} — TushN101{% endblock %}
{% block content %}

<a href="/" class="back-link">All posts</a>

<div class="post-header">
    <div class="post-meta">{{ post[3] }}</div>
    <h1 class="post-title">{{ post[1] }}</h1>
    {% if post[2] %}
    <p class="post-description">{{ post[2] }}</p>
    {% endif %}
</div>

<div class="post-body">
    {{ post[4] | safe }}
</div>

{% endblock %}
